services:
  nodelink:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NODELINK_SERVER_HOST: 0.0.0.0
      NODELINK_SERVER_PORT: 2333
      NODELINK_SERVER_PASSWORD: ${NODELINK_SERVER_PASSWORD}
    ports:
      - "2333:2333"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:2333},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000);
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
